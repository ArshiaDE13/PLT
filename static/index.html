<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐍 Python Tutor — Learn Python 3.14</title>
<script>
/* Restore the saved language + text direction before first paint (no flash). */
(function () {
  try {
    var l = localStorage.getItem('pytutor-lang-v1');
    if (l !== 'fa' && l !== 'en') {
      l = (navigator.language || '').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en';
    }
    var d = document.documentElement;
    d.lang = l;
    if (l === 'fa') { d.setAttribute('dir', 'rtl'); } else { d.removeAttribute('dir'); }
  } catch (e) {}
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260924">
</head>
<body>
<div id="welcome">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="orb o4"></div>
  <div class="orb o5"></div>
  <div class="floaty f1">🐍</div>
  <div class="floaty f2">⚡</div>
  <div class="floaty f3">🐍</div>
  <div class="floaty f4">💡</div>
  <div class="floaty f5">🐍</div>
  <span class="sparkle s1">✦</span>
  <span class="sparkle s2">✧</span>
  <span class="sparkle s3">✦</span>
  <div class="welcome-card">
    <div class="lang-switch" id="lang-welcome" role="group" aria-label="Language"></div>
    <div class="welcome-emoji">🐍</div>
    <h1>Python Tutor</h1>
    <p class="welcome-sub" data-i18n="welcome_sub"></p>
    <label for="name-input" data-i18n="name_label"></label>
    <input id="name-input" type="text" maxlength="30"
           placeholder="e.g. Ada" autocomplete="off"
           data-i18n-ph="name_placeholder">
    <button id="name-start" class="btn btn-lg" data-i18n="start_btn"></button>
    <p class="welcome-hint" data-i18n="welcome_hint"></p>
  </div>
</div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-logo">🐍</span>
      <div>
        <h1>Python Tutor</h1>
        <p class="brand-sub" data-i18n="brand_sub"></p>
      </div>
    </div>
    <div class="lang-switch on-dark" id="lang-side" role="group" aria-label="Language"></div>
    <p id="user-greeting" class="greeting"></p>
    <div class="progress-box">
      <div id="overall-label" class="progress-label" data-i18n="progress_label"></div>
      <div class="progress-track"><div id="overall-bar" class="progress-bar"></div></div>
      <div id="overall-text" class="progress-text"></div>
    </div>
    <button id="open-playground" class="playground-btn" data-i18n="playground_btn"></button>
    <nav id="chapter-list"></nav>
    <button id="change-name" class="change-name" data-i18n="change_name"></button>
  </aside>
  <main id="main">
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>
<script src="data.js?v=20260924"></script>
<script src="pyrunner.js?v=20260924"></script>
<script src="app.js?v=20260924"></script>
</body>
</html>
