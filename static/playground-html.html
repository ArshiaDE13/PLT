<!DOCTYPE html>
<html lang="en" data-subject="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🛡️ HTML Playground</title>
<script>
/* Restore the saved language + text direction before first paint (no flash). */
(function () {
  try {
    var l = localStorage.getItem('pytutor-lang-v1');
    if (l !== 'fa' && l !== 'en') {
      l = (navigator.language || '').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en';
    }
    var d = document.documentElement;
    d.lang = l;
    if (l === 'fa') { d.setAttribute('dir', 'rtl'); } else { d.removeAttribute('dir'); }
  } catch (e) {}
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛡️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261004a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#16364d">
<link rel="stylesheet" href="playground.css?v=20261004a">
</head>
<body>
<div id="pg">
  <header class="pg-top">
    <div class="pg-brand">
      <span class="pg-logo"><svg viewBox="0 0 100 100" style="width:30px;height:30px;display:block;direction:ltr" aria-hidden="true"><defs><linearGradient id="pgh-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f16529"/><stop offset="1" stop-color="#e44d26"/></linearGradient></defs><path d="M12 4h76l-7 66L50 92l-31-22z" fill="url(#pgh-g)"/><text x="50" y="37" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="40" fill="#fff">5</text></svg></span>
      <div>
        <h1 data-i18n="pg_title"></h1>
        <p class="pg-sub" data-i18n="pg_sub"></p>
      </div>
    </div>
    <div class="lang-switch on-light" id="lang-pg" role="group" aria-label="Language"></div>
  </header>

  <div class="pg-toolbar">
    <button id="pg-run" class="btn pg-run-btn"></button>
    <select id="pg-examples" class="pg-select" data-i18n-title="pg_examples"></select>
    <button id="pg-reset" class="btn secondary" data-i18n="pg_reset"></button>
    <span class="pg-spacer"></span>
    <span id="pg-save" class="pg-save"></span>
    <button id="pg-clear" class="btn secondary" data-i18n="pg_clear"></button>
    <button id="pg-close" class="btn secondary" data-i18n="pg_close"></button>
  </div>

  <div class="pg-main">
    <section class="pg-editor">
      <div class="pg-filebar">
        <span class="pg-fileico">📄</span><span class="pg-filename">index.html</span>
        <span class="pg-filetag">HTML · live preview</span>
      </div>
      <div class="pg-code-area">
        <div class="pg-gutter" id="pg-gutter" aria-hidden="true"><div>1</div></div>
        <div class="pg-stack">
          <pre class="pg-hl" id="pg-hl" aria-hidden="true"><code></code></pre>
          <textarea id="pg-code" class="pg-ta" wrap="off" spellcheck="false"
                    autocomplete="off" autocapitalize="off" autocorrect="off"
                    aria-label="HTML code editor"></textarea>
        </div>
      </div>
    </section>

    <section class="pg-console">
      <div class="pg-console-head">
        <span class="pg-console-title" data-i18n="pg_output"></span>
        <label class="pg-live" for="pg-live">
          <input type="checkbox" id="pg-live" checked> <span data-i18n="pg_live"></span>
        </label>
      </div>
      <iframe id="pg-preview" class="pg-preview" title="Live HTML preview"
              sandbox="allow-scripts allow-same-origin"></iframe>
    </section>
  </div>

  <footer class="pg-statusbar">
    <span id="pg-pos">Ln 1, Col 1</span>
    <span class="pg-spacer"></span>
    <span class="pg-shortcut" data-i18n="pg_shortcut"></span>
    <span id="pg-engine"></span>
  </footer>
</div>
<script src="playground-html.js?v=20261004a"></script>
</body>
</html>
